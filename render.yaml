# Render "Blueprint": Render.com -> New -> Blueprint -> shu repozitoriyni tanlang.
services:
  - type: web
    name: riyoziyot-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m bot
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TIMEZONE
        value: Asia/Tashkent
      # Quyidagilar maxfiy: qiymatlarini Render sahifasida o'zingiz kiritasiz
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        sync: false
